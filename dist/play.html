<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">R</span> Raptor Lounge</a></header><main class="play-wrap"><a class="back" href="index.html">&larr; Back to the arcade</a><div class="play-title"><div><p class="eyebrow">NOW PLAYING</p><h1 id="title"></h1></div><button id="full">Fullscreen</button></div><div class="game-stage" id="stage"><iframe id="frame" allowfullscreen></iframe></div></main><script>
