<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>FreeDoom</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #08060d; color: #f4efff; font-family: system-ui, sans-serif; }
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      textarea.emscripten { font-family: monospace; width: 80%; }
      div.emscripten { text-align: center; }
      div.emscripten_border { border: 0; min-height: 72vh; display: grid; place-items: center; background: #000; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten { border: 0px none; max-width: 100%; width: min(100%, 1100px); height: auto; image-rendering: pixelated; }
      button { border: 1px solid #a855f7; border-radius: 8px; padding: 9px 14px; background: #6d28d9; color: white; font: 700 14px system-ui, sans-serif; cursor: pointer; }
      button:hover { background: #8b5cf6; }
    </style>
  </head>
  <body>
    <p class="emscripten"><strong>FreeDoom</strong> &mdash; use the arrow keys to move and Ctrl to fire.</p>
    <p class="emscripten"><button id="newGame" type="button">Start a new game</button> <button id="openMenu" type="button">Open menu</button></p>
    <div class="emscripten" id="status">Downloading...</div>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>  
    </div>
    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <hr/>
    <div class="emscripten">
      <input type="checkbox" id="resize">Resize canvas
      <input type="checkbox" id="pointerLock" checked>Lock/hide mouse pointer
      &nbsp;&nbsp;&nbsp;
      <input type="button" value="Fullscreen" onclick="Module.requestFullScreen(document.getElementById('pointerLock').checked, 
                                                                                document.getElementById('resize').checked)">
    </div>
    
    <hr/>
    <textarea class="emscripten" id="output" rows="3" aria-label="Game loading log"></textarea>
    <script type='text/javascript'>
      // connect to canvas
      var Module = {
        preRun: [],
        postRun: [],
        print: (function() {
          var element = document.getElementById('output');
          element.value = ''; // clear browser cache
          return function(text) {
            text = Array.prototype.slice.call(arguments).join(' ');
            // These replacements are necessary if you render to raw HTML
            //text = text.replace(/&/g, "&amp;");
            //text = text.replace(/</g, "&lt;");
            //text = text.replace(/>/g, "&gt;");
            //text = text.replace('\n', '<br>', 'g');
            element.value += text + "\n";
            element.scrollTop = 99999; // focus on bottom
          };
        })(),
        printErr: function(text) {
          text = Array.prototype.slice.call(arguments).join(' ');
          if (0) { // XXX disabled for safety typeof dump == 'function') {
            dump(text + '\n'); // fast, straight to the real console
          } else {
            console.log(text);
          }
        },
        canvas: document.getElementById('canvas'),
        setStatus: function(text) {
          if (Module.setStatus.interval) clearInterval(Module.setStatus.interval);
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var statusElement = document.getElementById('status');
          var progressElement = document.getElementById('progress');
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
    </script>
    <script async type='text/javascript'>
// proxy to/from worker

Module.ctx = Module.canvas.getContext('2d');

var worker = new Worker('boon.js');

worker.onmessage = function(event) {
  var data = event.data;
  switch (data.target) {
    case 'stdout': {
      Module.print(data.content);
      break;
    }
    case 'stderr': {
      Module.printErr(data.content);
      break;
    }
    case 'window': {
      window[data.method]();
      break;
    }
    case 'canvas': {
      switch (data.op) {
        case 'resize': {
          Module.canvas.width = data.width;
          Module.canvas.height = data.height;
          Module.canvasData = Module.ctx.getImageData(0, 0, data.width, data.height);
          postMessage({ target: 'canvas', boundingClientRect: Module.canvas.getBoundingClientRect() });
          break;
        }
        case 'render': {
          var src = data.image.data;
          var dst = Module.canvasData.data;
          if (dst.set) {
            dst.set(src);
          } else {
            for (var i = 0; i < src.length; i++) {
              dst[i] = src[i];
            }
          }
          Module.ctx.putImageData(Module.canvasData, 0, 0);
          break;
        }
        default: throw 'eh?';
      }
      break;
    }
    default: throw 'what?';
  }
};

function cloneEvent(event) {
  var ret = {};
  for (var x in event) {
    if (x == x.toUpperCase()) continue;
    var prop = event[x];
    if (typeof prop === 'number' || typeof prop === 'string') ret[x] = prop;
  }
  return ret;
};

['keydown', 'keyup', 'keypress', 'blur', 'visibilitychange'].forEach(function(event) {
  document.addEventListener(event, function(event) {
    worker.postMessage({ target: 'document', event: cloneEvent(event) });
    event.preventDefault();
  });
});

['unload'].forEach(function(event) {
  window.addEventListener(event, function(event) {
    worker.postMessage({ target: 'window', event: cloneEvent(event) });
  });
});

['mousedown', 'mouseup', 'mousemove', 'DOMMouseScroll', 'mousewheel', 'mouseout'].forEach(function(event) {
  Module.canvas.addEventListener(event, function(event) {
    worker.postMessage({ target: 'canvas', event: cloneEvent(event) });
    event.preventDefault();
  }, true);
});

function sendDoomKey(keyCode) {
  worker.postMessage({ target: 'document', event: { type: 'keydown', keyCode: keyCode, which: keyCode, charCode: keyCode } });
  setTimeout(function() {
    worker.postMessage({ target: 'document', event: { type: 'keyup', keyCode: keyCode, which: keyCode, charCode: keyCode } });
  }, 45);
}

document.getElementById('openMenu').addEventListener('click', function() {
  sendDoomKey(27); // Escape
});

document.getElementById('newGame').addEventListener('click', function() {
  // Escape opens the menu; Enter selects New Game and the default difficulty.
  sendDoomKey(27);
  setTimeout(function() { sendDoomKey(13); }, 250);
  setTimeout(function() { sendDoomKey(13); }, 500);
});

</script>
  </body>
</html>
