<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mori's Pocket Pal</title><style>
:root{--ink:#151326;--panel:#252143;--violet:#865cff;--pink:#ff79ae;--cream:#fff6df;--good:#6ee1a7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 22% 5%,#704bb9 0,transparent 27rem),linear-gradient(145deg,#151326,#282144);font-family:Arial,sans-serif;color:#fff}.game{max-width:980px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #ffffff24;padding-bottom:17px}.title{font-size:clamp(1.5rem,4vw,2.35rem);font-weight:900;letter-spacing:-.07em}.title b{color:var(--pink)}.days{font-weight:800;color:#e6dbff;background:#ffffff13;padding:10px 13px;border-radius:999px}.intro{color:#d8ceea;margin:17px 0}.layout{display:grid;grid-template-columns:1.08fr .92fr;gap:20px}.room{min-height:470px;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(#bd8cff 0 69%,#f0c884 69%);border:1px solid #ffffff2d}.window{position:absolute;right:38px;top:40px;width:120px;height:110px;border:9px solid #fff2;border-radius:18px;background:linear-gradient(#75c6ff,#d9f8ff 66%,#8ddd76 66%)}.cloud{position:absolute;top:19px;left:15px;color:#fff9;font-size:28px}.rug{position:absolute;bottom:-35px;left:16%;width:68%;height:105px;border-radius:50%;background:#f178a9}.shelf{position:absolute;left:34px;top:95px;width:125px;height:13px;background:#805735}.shelf:after{content:'🪴  📚  ✨';position:absolute;top:-31px;font-size:25px;white-space:nowrap}.mori{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);width:210px;height:220px;filter:drop-shadow(0 16px 8px #291c4b55)}.body{position:absolute;bottom:0;left:24px;width:162px;height:165px;background:#fc6a68;border:8px solid #34244c;border-radius:48% 48% 42% 42%}.face{position:absolute;z-index:1;top:21px;left:39px;width:132px;height:122px;background:var(--cream);border:7px solid #34244c;border-radius:44% 44% 48% 48%}.eye{position:absolute;top:46px;width:23px;height:28px;border-radius:50%;background:#34244c}.eye:after{content:'';position:absolute;top:5px;left:5px;width:7px;height:8px;background:#fff;border-radius:50%}.eye.l{left:29px}.eye.r{right:29px}.mouth{position:absolute;bottom:20px;left:49px;width:27px;height:13px;border-bottom:4px solid #34244c;border-radius:50%}.cheek{position:absolute;top:76px;width:20px;height:10px;background:#ff98a8;border-radius:50%}.cheek.l{left:9px}.cheek.r{right:9px}.hat{position:absolute;z-index:2;left:28px;top:0;width:154px;height:67px;background:#805cff;border:7px solid #34244c;border-radius:50% 50% 17px 17px}.hat:after{content:'✦';position:absolute;left:56px;top:9px;color:#fff;font-size:28px}.bubble{position:absolute;z-index:4;left:50%;top:22px;transform:translateX(-50%);background:#fff;color:#3a2a50;font-weight:800;padding:11px 15px;border-radius:16px;min-width:150px;text-align:center}.bubble:after{content:'';position:absolute;bottom:-12px;left:50%;border:8px solid transparent;border-top-color:#fff}.panel{padding:20px;border-radius:24px;background:#201c38e8;border:1px solid #ffffff1e}.panel h2{margin:0;font-size:1.45rem}.bars{display:grid;gap:13px;margin:20px 0}.stat{display:grid;grid-template-columns:60px 1fr 35px;gap:8px;align-items:center;font-weight:800;font-size:.86rem}.track{height:14px;background:#ffffff17;border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--pink));transition:width .3s}.number{color:#e8ddff}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{border:1px solid #ffffff27;background:#ffffff10;border-radius:16px;color:#fff;padding:13px 8px;font:inherit;font-weight:900;cursor:pointer;min-height:87px}.action:hover{transform:translateY(-2px);background:#865cff}.action span{display:block;font-size:27px;margin-bottom:5px}.goal{margin-top:17px;padding:13px;border-radius:14px;background:#6ee1a71e;color:#c8ffe1;font-size:.9rem;line-height:1.4}.badge{display:inline-block;margin-top:14px;padding:8px 10px;border-radius:999px;background:#ffffff12;color:#e9ddff;font-weight:800;font-size:.82rem}@media(max-width:700px){.game{padding:14px}.layout{grid-template-columns:1fr}.room{min-height:390px}.mori{transform:translateX(-50%) scale(.86);transform-origin:bottom}.window{right:20px;top:25px}.shelf{left:20px;top:80px}}
</style></head><body><main class="game"><header class="top"><div class="title">MORI'S <b>POCKET PAL</b></div><div class="days">Day <span id="day">1</span> • Besties</div></header><p class="intro">Take care of Mori! Keep all three meters happy and see what your pocket pal says.</p><div class="layout"><section class="room"><div class="window"><span class="cloud">☁</span></div><div class="shelf"></div><div class="bubble" id="bubble">Hi! Let's hang out!</div><div class="mori"><div class="hat"></div><div class="body"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="mouth"></i></div></div><div class="rug"></div></section><section class="panel"><h2>Care time</h2><div class="bars"><div class="stat"><span>Hunger</span><div class="track"><div class="fill" id="hunger"></div></div><span class="number" id="hunger-n"></span></div><div class="stat"><span>Joy</span><div class="track"><div class="fill" id="joy"></div></div><span class="number" id="joy-n"></span></div><div class="stat"><span>Energy</span><div class="track"><div class="fill" id="energy"></div></div><span class="number" id="energy-n"></span></div></div><div class="actions"><button class="action" data-action="feed"><span>🍓</span>Feed</button><button class="action" data-action="play"><span>🪀</span>Play</button><button class="action" data-action="nap"><span>🌙</span>Nap</button></div><div class="goal" id="goal">Goal: try each activity and fill all three meters. Mori loves a balanced day!</div><div class="badge" id="badge">✨ 0 care actions today</div></section></div></main><script>
const stats={hunger:64,joy:58,energy:72};let actions=0,day=1;const quotes={feed:['Yum! My favorite!','Berry good choice!','Snack time makes me happy!'],play:['Again again!','That was so fun!','You are my best teammate!'],nap:['Zzz... I feel refreshed!','Cozy nap complete!','Dreaming of snacks!']};function draw(){Object.entries(stats).forEach(([k,v])=>{document.querySelector('#'+k).style.width=v+'%';document.querySelector('#'+k+'-n').textContent=v});document.querySelector('#badge').textContent='✨ '+actions+' care action'+(actions===1?'':'s')+' today';if(Object.values(stats).every(v=>v>=85))document.querySelector('#goal').textContent='Amazing! Mori is feeling great. You earned a perfect-care day! 🏆'}document.querySelector('#day').textContent=day}document.querySelectorAll('.action').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='feed'){stats.hunger=Math.min(100,stats.hunger+26);stats.joy=Math.min(100,stats.joy+6);stats.energy=Math.max(0,stats.energy-5)}if(a==='play'){stats.joy=Math.min(100,stats.joy+28);stats.energy=Math.max(0,stats.energy-12);stats.hunger=Math.max(0,stats.hunger-8)}if(a==='nap'){stats.energy=Math.min(100,stats.energy+28);stats.hunger=Math.max(0,stats.hunger-5)}actions++;if(actions%6===0)day++;document.querySelector('#bubble').textContent=quotes[a][Math.floor(Math.random()*quotes[a].length)];draw()});draw();
</script></body></html>
